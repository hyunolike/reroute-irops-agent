# OpenShell provider profile: Nemotron chat completions for the ReRoute agent worker.
# The sandbox only ever sees a placeholder NVIDIA_API_KEY; the OpenShell proxy substitutes the real key on this
# endpoint only. Narrower than NVIDIA's example profile (whole host, curl): one path, the image's Python.
#   openshell provider profile import -f nvidia-reroute.yaml
#   NVIDIA_API_KEY=... openshell provider create --name nvidia-prod --type nvidia-reroute --from-existing
id: nvidia-reroute
display_name: NVIDIA NIM (ReRoute agent)
description: Nemotron chat completions for the ReRoute agent worker
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v1/chat/completions" }
binaries: [/app/.venv/bin/python*, /usr/local/bin/python*]
