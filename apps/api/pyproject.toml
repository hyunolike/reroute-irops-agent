[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reroute-api"
version = "0.1.0"
description = "ReRoute - Autonomous Airline Disruption Recovery Agent (API + Mock Airline System)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  # MCP server for external agents (OpenClaw in NVIDIA NemoClaw). 2.x API (MCPServer); pinned to the major.
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# NVIDIA cuOpt thin client (talks to a self-hosted cuOpt server). Optional: the
# CuOptOptimizationProvider speaks the documented REST API directly via httpx.
cuopt = ["cuopt-sh-client"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E731", "E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
