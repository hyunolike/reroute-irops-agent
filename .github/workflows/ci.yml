name: ci

on:
  push:
    # develop is covered by deploy.yml, which runs this workflow before deploying
    branches: [main, "claude/**"]
  pull_request:
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reroute
          POSTGRES_PASSWORD: reroute
          POSTGRES_DB: reroute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reroute" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 .venv && uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/ruff check app tests && .venv/bin/ruff format --check app tests
      - run: .venv/bin/python -m pytest -q
      - name: smoke test on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://reroute:reroute@localhost:5432/reroute
          DEMO_MODE: "true"
        run: |
          .venv/bin/uvicorn app.asgi:app --port 8000 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          ../../tests/e2e/smoke.sh http://localhost:8000

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t reroute-api:ci .
      - run: docker build -t reroute-web:ci apps/web
